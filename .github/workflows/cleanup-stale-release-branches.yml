name: Cleanup Stale Release Branches

# FMOPS-3389: delete release branches with no commits in the last 12 months.
# The repo's default branch is always skipped. Tags are never touched.
#
# Two-stage, approval-gated design:
#   1. `plan` always runs first: scans branches, posts the candidate list to
#      Slack and the Job Summary, but NEVER deletes anything itself.
#   2. `apply` only runs when there is something to delete AND it is not a
#      dry run. It is gated behind the `release-branch-cleanup-approval`
#      GitHub Environment, which requires a human reviewer to approve the
#      run (Actions tab -> "Review deployments") before anything is
#      actually deleted - including on the automatic monthly schedule.
#
# One-time setup needed: create an Environment named
# `release-branch-cleanup-approval` in Settings -> Environments, with
# "Required reviewers" turned on and the right people/team added.

on:
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, delete nothing)"
        type: boolean
        default: true
      branch_pattern:
        description: "Glob for release branches (supports * wildcard)"
        type: string
        default: "releases/*"
      exclude_branches:
        description: "Comma-separated branch names to always keep"
        type: string
        default: "dev,main,master,releases/lts/v26.07.20,releases/sts/v26.04.20"
      inactivity_days:
        description: "Days of inactivity before a branch is eligible for deletion"
        type: number
        default: 365
      max_deletions:
        description: "Safety cap on deletions in one run (0 = unlimited)"
        type: number
        default: 0

jobs:
  plan:
    name: Scan for stale release branches
    runs-on: ubuntu-latest
    env:
      # On a scheduled run there is no `inputs` object, so DRY_RUN falls back
      # to 'false' (real cleanup, pending approval). On workflow_dispatch it
      # takes whatever the form/API call supplied, defaulting to 'true'.
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}
      BRANCH_PATTERN: ${{ github.event.inputs.branch_pattern || 'releases/*' }}
      EXCLUDE_BRANCHES: ${{ github.event.inputs.exclude_branches || 'dev,main,master,releases/lts/v26.07.20,releases/sts/v26.04.20' }}
      INACTIVITY_DAYS: ${{ github.event.inputs.inactivity_days || '365' }}
      MAX_DELETIONS: ${{ github.event.inputs.max_deletions || '0' }}
    outputs:
      dry_run: ${{ steps.scan.outputs.dry_run }}
      candidates: ${{ steps.scan.outputs.candidates }}
    steps:
      - name: Scan branches (no deletions happen here)
        id: scan
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const pattern = process.env.BRANCH_PATTERN;
            const excludeList = process.env.EXCLUDE_BRANCHES.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            const inactivityDays = parseInt(process.env.INACTIVITY_DAYS, 10);
            const dryRun = process.env.DRY_RUN === 'true';
            const maxDeletions = parseInt(process.env.MAX_DELETIONS, 10);

            const { owner, repo } = context.repo;

            const repoInfo = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.data.default_branch;

            const escaped = pattern.split('*').map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.*');
            const patternRegex = new RegExp('^' + escaped + '$');

            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            const cutoff = Date.now() - inactivityDays * 24 * 60 * 60 * 1000;

            const results = [];
            let candidateCount = 0;

            for (const b of branches) {
              const name = b.name;

              if (name === defaultBranch) continue;
              if (excludeList.includes(name.toLowerCase())) continue;
              if (!patternRegex.test(name)) continue;

              const commit = await github.rest.repos.getCommit({ owner, repo, ref: b.commit.sha });
              const commitDateStr = commit.data.commit.committer.date || commit.data.commit.author.date;
              const lastDate = new Date(commitDateStr);
              const ageDays = Math.floor((Date.now() - lastDate.getTime()) / (24 * 60 * 60 * 1000));

              if (lastDate.getTime() > cutoff) {
                results.push({ name, ageDays, status: 'kept', reason: `active within ${inactivityDays} days` });
                continue;
              }

              if (maxDeletions > 0 && candidateCount >= maxDeletions) {
                results.push({ name, ageDays, status: 'skipped', reason: 'max_deletions cap reached' });
                continue;
              }

              candidateCount++;
              results.push({ name, ageDays, status: 'candidate', reason: `inactive > ${inactivityDays} days` });
            }

            const candidates = results.filter(r => r.status === 'candidate');

            const summary = core.summary
              .addHeading('Release Branch Cleanup - Plan')
              .addRaw(
                `**Mode:** ${dryRun ? 'DRY RUN' : 'LIVE - pending approval'}  \n` +
                `**Pattern:** \`${pattern}\`  \n` +
                `**Inactivity threshold:** ${inactivityDays} days  \n` +
                `**Always kept:** ${defaultBranch} (default), ${excludeList.join(', ')}  \n\n`
              );

            if (candidates.length === 0) {
              summary.addRaw(dryRun
                ? '_No branches would be deleted this run._\n'
                : '_Nothing to delete this run - no branches are eligible._\n');
            } else {
              summary.addHeading(dryRun ? 'Would delete' : 'Pending deletion (needs approval)', 3);
              const candidateRows = [[
                { data: 'Branch', header: true },
                { data: 'Age (days)', header: true },
              ]];
              for (const r of candidates) {
                candidateRows.push([r.name, String(r.ageDays)]);
              }
              summary.addTable(candidateRows);
            }

            const others = results.filter(r => r.status !== 'candidate');
            if (others.length > 0) {
              summary.addRaw('\n<details><summary>All other matched branches (kept/skipped) - click to expand</summary>\n\n');
              const otherRows = [[
                { data: 'Branch', header: true },
                { data: 'Age (days)', header: true },
                { data: 'Status', header: true },
                { data: 'Reason', header: true },
              ]];
              for (const r of others) {
                otherRows.push([r.name, String(r.ageDays), r.status, r.reason]);
              }
              summary.addTable(otherRows);
              summary.addRaw('\n</details>\n');
            }
            await summary.write();

            core.info(`Found ${candidates.length} candidate(s) for deletion.`);
            core.setOutput('candidates', JSON.stringify(candidates.map(c => c.name)));
            core.setOutput('dry_run', dryRun ? 'true' : 'false');

            const webhookUrl = process.env.SLACK_WEBHOOK_URL;
            if (!webhookUrl) {
              core.info('SLACK_WEBHOOK_URL not set - skipping Slack notification.');
            } else {
              const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              const lines = [];

              if (dryRun) {
                lines.push(`:mag: Release branch cleanup *dry run* completed in \`${owner}/${repo}\``);
              } else if (candidates.length > 0) {
                lines.push(`:hourglass_flowing_sand: Release branch cleanup found *${candidates.length}* branch(es) to delete in \`${owner}/${repo}\` - *awaiting approval*`);
              } else {
                lines.push(`:white_check_mark: Release branch cleanup ran in \`${owner}/${repo}\` - nothing to delete this time`);
              }

              lines.push(`Pattern: \`${pattern}\` | Threshold: ${inactivityDays} days | Matched: ${results.length} | Candidates: ${candidates.length}`);

              if (candidates.length > 0) {
                lines.push(dryRun ? '*Would delete (dry run):*' : '*Pending deletion (needs approval):*');
                lines.push(candidates.map(c => `• \`${c.name}\` (inactive ${c.ageDays} days)`).join('\n'));
              }

              lines.push(!dryRun && candidates.length > 0
                ? `<${runUrl}|Review and approve/reject this run>`
                : `<${runUrl}|View full run details>`);

              try {
                const resp = await fetch(webhookUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ text: lines.join('\n') }),
                });
                if (!resp.ok) {
                  core.warning(`Slack notification returned ${resp.status}: ${await resp.text()}`);
                }
              } catch (slackErr) {
                core.warning(`Slack notification failed: ${slackErr.message || slackErr}`);
              }
            }

      - name: Notify Slack on plan failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::notice::SLACK_WEBHOOK_URL secret not set - skipping Slack notification."
            exit 0
          fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: Release branch cleanup *scan* failed in ${{ github.repository }} (run <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_id }}>). Please investigate.\"}" \
            "$SLACK_WEBHOOK_URL"

  apply:
    name: Delete approved branches
    needs: plan
    if: needs.plan.outputs.dry_run == 'false' && needs.plan.outputs.candidates != '[]'
    runs-on: ubuntu-latest
    environment: release-branch-cleanup-approval
    permissions:
      contents: write
    steps:
      - name: Delete the approved branches
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CANDIDATES: ${{ needs.plan.outputs.candidates }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const candidates = JSON.parse(process.env.CANDIDATES);

            const deleted = [];
            const skipped = [];
            const errors = [];

            for (const name of candidates) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                deleted.push(name);
              } catch (e) {
                const msg = e.message || String(e);
                if (e.status === 404 || e.status === 422 || /protected/i.test(msg)) {
                  skipped.push({ name, reason: msg });
                  core.warning(`Skipped ${name}: ${msg}`);
                } else {
                  errors.push({ name, reason: msg });
                  core.error(`Failed to delete ${name}: ${msg}`);
                }
              }
            }

            const summary = core.summary
              .addHeading('Release Branch Cleanup - Apply (approved)')
              .addRaw(`**Deleted:** ${deleted.length} | **Skipped:** ${skipped.length} | **Errors:** ${errors.length}\n\n`);

            if (deleted.length > 0) {
              summary.addRaw('**Deleted branches:**\n' + deleted.map(n => `- \`${n}\``).join('\n') + '\n\n');
            }
            if (skipped.length > 0) {
              summary.addRaw('**Skipped (likely protected):**\n' + skipped.map(s => `- \`${s.name}\`: ${s.reason}`).join('\n') + '\n\n');
            }
            if (errors.length > 0) {
              summary.addRaw('**Errors:**\n' + errors.map(e => `- \`${e.name}\`: ${e.reason}`).join('\n') + '\n\n');
            }
            await summary.write();

            const webhookUrl = process.env.SLACK_WEBHOOK_URL;
            if (webhookUrl) {
              const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              const lines = [
                `:white_check_mark: Release branch cleanup *approved and applied* in \`${owner}/${repo}\``,
                `Deleted: ${deleted.length} | Skipped: ${skipped.length} | Errors: ${errors.length}`,
              ];
              if (deleted.length > 0) {
                lines.push('*Deleted branches:*');
                lines.push(deleted.map(n => `• \`${n}\``).join('\n'));
              }
              if (errors.length > 0) {
                lines.push('*Errors:*');
                lines.push(errors.map(e => `• \`${e.name}\`: ${e.reason}`).join('\n'));
              }
              lines.push(`<${runUrl}|View full run details>`);
              try {
                const resp = await fetch(webhookUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ text: lines.join('\n') }),
                });
                if (!resp.ok) core.warning(`Slack notification returned ${resp.status}: ${await resp.text()}`);
              } catch (slackErr) {
                core.warning(`Slack notification failed: ${slackErr.message || slackErr}`);
              }
            }

            if (errors.length > 0) {
              core.setFailed(`${errors.length} branch deletion(s) failed unexpectedly - see job summary for details.`);
            }

      - name: Notify Slack on apply failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::notice::SLACK_WEBHOOK_URL secret not set - skipping Slack notification."
            exit 0
          fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: Release branch cleanup *apply step* failed in ${{ github.repository }} (run <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_id }}>). Please investigate.\"}" \
            "$SLACK_WEBHOOK_URL"
